name: TensorFold adapter CPU checks
on:
  push:
    paths: ['specpilot_tensorfold/**', 'scripts/tensorfold.py', 'tests/tensorfold/**', '.github/workflows/tensorfold-adapter.yml']
  pull_request:
    paths: ['specpilot_tensorfold/**', 'scripts/tensorfold.py', 'tests/tensorfold/**', '.github/workflows/tensorfold-adapter.yml']
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests/tensorfold -v
      - run: python -m specpilot_tensorfold --help
      - run: python scripts/tensorfold.py --help
